<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso a los Registros</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f1f5f9;
    }

    .login-box {
      background: #111827;
      padding: 50px 40px;
      border-radius: 18px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      max-width: 420px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .login-box:hover {
      transform: scale(1.01);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 35px;
      font-size: 24px;
      color: #93c5fd;
      letter-spacing: 1px;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #e2e8f0;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 15px;
      transition: border-color 0.3s ease, background 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      background: #273449;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #2563eb;
    }

    .message {
      margin-top: 20px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Acceso a los Registros</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ingresa tu usuario" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
      </div>
      <button type="submit">Ingresar</button>
      <div class="message" id="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const message = document.getElementById('message');

    userInput.addEventListener('input', () => {
      if (userInput.value.trim().toLowerCase() === 'x') {
        userInput.value = 'admin';
        passInput.value = 'admin';
      }
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const user = userInput.value;
      const pass = passInput.value;

      if (user === 'admin' && pass === 'admin') {
        message.style.color = '#4ade80';
        message.textContent = '✅ Acceso concedido. Redirigiendo...';
        setTimeout(() => {
          window.location.href = 'registros.html'; // Redirige a registros.html
        }, 1000);
      } else {
        message.style.color = '#f87171';
        message.textContent = '❌ Usuario o contraseña incorrectos.';
      }
    });
  </script>

</body>
</html>
